{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Products</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: .4rem .6rem;
            text-align: left;
        }
    </style>
</head>
<body>
<h1>Products</h1>
<p><a href="{% url 'product-create' %}">Add product</a></p>
{% if object_list %}
    <table>
        <thead>
        <tr>
            <th>Code</th>
            <th>Name</th>
            <th>URL</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        {% for product in object_list %}
            <tr>
                <td>{{ product.code }}</td>
                <td>{{ product.name }}</td>
                <td>{{ product.url|default:"-" }}</td>
                <td><a href="{% url 'product-edit' product.pk %}">Edit</a> <a
                        href="{% url 'product-delete' product.pk %}">Delete</a></td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% else %}
    <p>No products yet.</p>
{% endif %}
</body>
</html>
