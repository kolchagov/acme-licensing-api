{% extends 'index.html' %}
{% block title %}{% if object %}Edit product{% else %}New product{% endif %}{% endblock %}
{% block content %}
    <h1 class="my-4">{% if object %}Edit product{% else %}New product{% endif %}</h1>
    <form method="post" class="col-lg-6">
        {% csrf_token %}
        {% include 'bs5/form.html' %}
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-link" href="{% url 'product-list' %}">Cancel</a>
    </form>
{% endblock %}
