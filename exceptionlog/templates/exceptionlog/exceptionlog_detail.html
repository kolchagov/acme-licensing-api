<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Exception log entry</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
        }

        pre {
            background: #f4f4f4;
            padding: .6rem;
            overflow-x: auto;
        }
    </style>
</head>
<body>
<h1>Exception log entry</h1>
<p><strong>Timestamp:</strong> {{ object.timestamp }}</p>
<p><strong>App:</strong> {{ object.app }}</p>
<p><strong>Version:</strong> {{ object.version }}</p>
<p><strong>Level:</strong> {{ object.level }}</p>
<p><strong>IP:</strong> {{ object.ip|default:"-" }}</p>
<p><strong>Message:</strong> {{ object.message }}</p>
<p><strong>Stacktrace:</strong></p>
<pre>{{ object.stacktrace|default:"-" }}</pre>
<p>
    <a href="{% url 'exceptionlog-delete' object.pk %}">Delete</a>
    <a href="{% url 'exceptionlog-list' %}">Back</a>
</p>
</body>
</html>
