<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Delete exception log</title>
</head>
<body>
<h1>Delete exception log</h1>
<p>Delete "{{ object.message }}"? This cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
    <a href="{% url 'exceptionlog-list' %}">Cancel</a>
</form>
</body>
</html>
