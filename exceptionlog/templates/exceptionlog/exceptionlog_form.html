{% extends 'index.html' %}
{% block title %}New exception log{% endblock %}
{% block content %}
    <h1 class="my-4">New exception log</h1>
    <form method="post" class="col-lg-6">
        {% csrf_token %}
        {% include 'bs5/form.html' %}
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-link" href="{% url 'exceptionlog-list' %}">Cancel</a>
    </form>
{% endblock %}
