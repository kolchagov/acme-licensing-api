<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% if object %}Edit trial{% else %}Add trial{% endif %}</title>
</head>
<body>
<h1>{% if object %}Edit trial{% else %}Add trial{% endif %}</h1>
<form method="post">

    {{ form.as_p }}

</form>
<p><a href="{% url 'trial-list' %}">Cancel</a></p>
</body>
</html>
