{% extends 'index.html' %}
{% block title %}Delete trial{% endblock %}
{% block content %}
    <h1 class="my-4">Delete trial</h1>
    <p>Delete "{{ object.device_sn }}"? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a class="btn btn-link" href="{% url 'trial-list' %}">Cancel</a>
    </form>
{% endblock %}
