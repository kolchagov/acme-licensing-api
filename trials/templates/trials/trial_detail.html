{% extends 'index.html' %}
{% block title %}{{ trial.device_sn }}{% endblock %}
{% block content %}
    <main class="py-4">
        <h1 class="h3 mb-4">{{ trial.device_sn }}</h1>
        <div class="card">
            <div class="card-body">
                <dl class="row mb-0">
                    <dt class="col-sm-3">Product</dt>
                    <dd class="col-sm-9">{{ trial.app }}</dd>
                    <dt class="col-sm-3">Installed</dt>
                    <dd class="col-sm-9">{{ trial.date_installed }}</dd>
                    <dt class="col-sm-3">Details</dt>
                    <dd class="col-sm-9">{{ trial.details|linebreaksbr }}</dd>
                </dl>
            </div>
            <div class="card-footer d-flex justify-content-end gap-2">
                <a class="btn btn-link me-auto" href="{% url 'trial-list' %}">Back to trials</a>
                <a class="btn btn-outline-secondary" href="{% url 'trial-edit' trial.pk %}">Edit</a>
                <a class="btn btn-outline-danger" href="{% url 'trial-delete' trial.pk %}">Delete</a>
            </div>
        </div>
    </main>
{% endblock %}
