{% extends 'index.html' %}
{% block title %}Delete license{% endblock %}
{% block content %}
    <h1 class="my-4">Delete license</h1>
    <p>Delete license "{{ object.pk }}" for {{ object.customer }}? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a class="btn btn-link" href="{% url 'license-list' %}">Cancel</a>
    </form>
{% endblock %}
