<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Delete license</title>
</head>
<body>
<h1>Delete license</h1>
<p>Delete license "{{ object.pk }}" for {{ object.customer }}? This cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
    <a href="{% url 'license-list' %}">Cancel</a>
</form>
</body>
</html>
