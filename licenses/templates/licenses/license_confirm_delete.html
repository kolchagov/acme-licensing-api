{% extends 'index.html' %}
{% block title %}Delete license{% endblock %}
{% block content %}
    <main class="py-4">
        <h1 class="h3 mb-4">Delete license</h1>
        <form method="post" class="card">
            <div class="card-body">
                {% csrf_token %}
                <p class="mb-0">Delete license "{{ object.pk }}" for {{ object.customer }}? This cannot be undone.</p>
            </div>
            <div class="card-footer d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary" href="{% url 'license-list' %}">Cancel</a>
                <button type="submit" class="btn btn-danger">Delete</button>
            </div>
        </form>
    </main>
{% endblock %}
