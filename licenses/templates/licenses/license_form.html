{% extends 'index.html' %}
{% block title %}{% if object %}Edit license{% else %}Add license{% endif %}{% endblock %}
{% block content %}
    <main class="py-4">
        <h1 class="h3 mb-4">{% if object %}Edit license{% else %}Add license{% endif %}</h1>
        <form method="post" class="card">
            <div class="card-body">
                {% csrf_token %}
                {% include 'bs5/form.html' %}
            </div>
            <div class="card-footer d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary" href="{% url 'license-list' %}">Cancel</a>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </main>
{% endblock %}
