{% extends 'index.html' %}
{% block title %}Delete customer{% endblock %}
{% block content %}
    <h1 class="my-4">Delete customer</h1>
    <p>Delete "{{ object.name }}"? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a class="btn btn-link" href="{% url 'customers-list' %}">Cancel</a>
    </form>
{% endblock %}
